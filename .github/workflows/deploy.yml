name: Build ZIP Deploy

# Alur deploy sekarang (FTP hosting rusak: FTPS putus terus, user FTP
# di-jail dan tidak bisa menjangkau /home/kunuuzu/laravel):
# 1. Setiap push ke main -> GitHub membangun deploy.zip (kode + hasil Vite).
# 2. Download deploy.zip dari halaman Actions run (bagian Artifacts).
# 3. Upload deploy.zip via cPanel File Manager ke /home/kunuuzu/laravel/
#    lalu Extract di sana (timpa). Hapus zip setelahnya.
# 4. Pastikan .env live punya DEPLOY_TOKEN + GOOGLE_SITE_VERIFICATION,
#    lalu picu webhook (atau minta asisten): akan migrate + sinkron
#    public/ -> public_html + optimize:clear.
#
# Yang TIDAK ikut ke zip (dilindungi): .env*, database sqlite, storage/,
# vendor/ (sudah ada di server), node_modules, public/index.php + .htaccess.
"on":
  push:
    branches: [main]

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependency PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build assets (Vite)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Rakit deploy.zip
        run: |
          rm -rf /tmp/deploy && mkdir -p /tmp/deploy
          git archive HEAD | tar -x -C /tmp/deploy
          rm -f /tmp/deploy/public/index.php /tmp/deploy/public/.htaccess
          cp -r public/build /tmp/deploy/public/build
          cd /tmp/deploy && zip -qr "$GITHUB_WORKSPACE/deploy.zip" .

      - name: Upload artifact deploy.zip
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy.zip
          retention-days: 14
