name: Deploy ke ArenHost

# Berjalan otomatis setiap ada push ke branch main:
# build assets -> upload file -> migrate database -> clear cache.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependency PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build assets (Vite)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload ke server + migrate
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "./"
          TARGET: "/home/kunuuzul/laravel"
          # Dilindungi (tidak ikut tertimpa):
          # .env server, database lokal, folder storage (isi upload),
          # index.php + .htaccess public_html (sudah disesuaikan server).
          EXCLUDE: "/.git/, /node_modules/, /.env, /.env.backup, /.env.production, /*.sqlite*, /storage/, /public/index.php, /public/.htaccess"
          ARGS: "-rltgoDzvO"
          SCRIPT_AFTER: |
            cd /home/kunuuzul/laravel
            php artisan migrate --force
            php artisan optimize:clear
