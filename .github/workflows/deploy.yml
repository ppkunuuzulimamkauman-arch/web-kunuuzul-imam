name: Deploy ke ArenHost

# Berjalan otomatis setiap ada push ke branch main:
# install -> build assets -> upload via FTP -> migrate via webhook.
#
# Yang dilindungi (tidak ikut tertimpa di server):
# .env, database sqlite lokal, folder storage/ (isi upload),
# public/index.php + public/.htaccess (sudah disesuaikan server).
# vendor/ juga tidak ikut upload (ribuan file, bikin FTP macet) —
# vendor server diasumsikan sudah cocok dengan composer.lock.
# Jika composer.json/lock berubah, upload vendor manual via cPanel.
"on":
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependency PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build assets (Vite)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (eksplisit TLS) putus di sisi server (ECONNRESET/TLS decode
          # error tiap transfer data). SSH juga diblokir firewall hosting,
          # jadi pakai FTP biasa agar deploy bisa jalan. Akun FTP sebaiknya
          # di-jail ke folder aplikasi saja. Jika host perbaiki FTPS,
          # kembalikan ke: protocol: ftps
          protocol: ftp
          local-dir: ./
          # PENTING (hasil investigasi 15 Okt 2026 via cPanel File Manager):
          # - User FTP mendarat di kunuuzulimamkauman.net/deploy/ (bukan home).
          # - Aplikasi LIVE ada di /home/kunuuzu/laravel/ karena
          #   public_html/index.php require __DIR__.'/../laravel/...'.
          # - Folder public live = /home/kunuuzu/public_html (copy terpisah,
          #   bukan symlink), jadi assets public disinkron terpisah di bawah.
          server-dir: ../../laravel/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            tests/**
            .github/**
            .env
            .env.backup
            .env.production
            database/*.sqlite*
            storage/**
            public/index.php
            public/.htaccess

      # Catatan: sinkron public/ -> public_html TIDAK lewat FTP (koneksi data
      # FTP ke hosting ini sering ECONNRESET). Sebagai gantinya, deploy-hook
      # di bawah menyalinnya secara lokal di server (cepat & andal).
      - name: Migrate database via webhook
        run: |
          curl -sS -X POST "https://kunuuzulimamkauman.net/deploy-hook" \
            --data-urlencode "token=${{ secrets.DEPLOY_TOKEN }}" \
            --fail --max-time 300
